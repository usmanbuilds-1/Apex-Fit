name: Temporary progress review
on:
  pull_request:
    branches: [main]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p review-captures
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.apexfit.app/.MainActivity
            sleep 20
            adb exec-out screencap -p > review-captures/onboarding.png
            adb shell input tap 160 592
            sleep 10
            adb shell input tap 280 596
            sleep 5
            adb exec-out screencap -p > review-captures/progress.png
            adb shell input tap 248 290
            sleep 4
            adb exec-out screencap -p > review-captures/history.png
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb shell input tap 92 350
            sleep 4
            adb exec-out screencap -p > review-captures/records.png
            adb shell input keyevent KEYCODE_BACK
            sleep 3
            adb shell input tap 170 205
            sleep 4
            adb exec-out screencap -p > review-captures/recovery.png
            adb shell input tap 265 205
            sleep 4
            adb exec-out screencap -p > review-captures/body.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: progress-review
          path: review-captures/
