name: Temporary Android review
on:
  pull_request:
    branches: [main]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p review-captures
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view workout
            sleep 4
            adb exec-out screencap -p > review-captures/workout.png
            adb shell am force-stop com.apexfit.app
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view rir
            sleep 4
            adb exec-out screencap -p > review-captures/rir.png
            adb shell am force-stop com.apexfit.app
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view rest
            sleep 4
            adb exec-out screencap -p > review-captures/rest.png
            adb shell am force-stop com.apexfit.app
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view complete
            sleep 4
            adb exec-out screencap -p > review-captures/complete.png
            adb shell settings put system font_scale 1.3
            adb shell am force-stop com.apexfit.app
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view workout
            sleep 4
            adb exec-out screencap -p > review-captures/workout_large.png
            adb shell am force-stop com.apexfit.app
            adb shell am start -n com.apexfit.app/.UiReviewActivity --es view complete
            sleep 4
            adb exec-out screencap -p > review-captures/complete_large.png
            adb shell settings put system font_scale 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-captures
          path: review-captures/
