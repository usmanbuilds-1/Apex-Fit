name: UI capture
on:
  pull_request:
    branches: [main]
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p screen-captures
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.apexfit.app/.MainActivity
            sleep 20
            adb exec-out screencap -p > screen-captures/onboarding.png
            adb shell input tap 160 592
            sleep 10
            adb exec-out screencap -p > screen-captures/home.png
            adb shell input tap 120 596
            sleep 4
            adb exec-out screencap -p > screen-captures/train.png
            adb shell input tap 200 596
            sleep 4
            adb exec-out screencap -p > screen-captures/nutrition.png
            adb shell input tap 280 596
            sleep 4
            adb exec-out screencap -p > screen-captures/progress.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screens
          path: screen-captures/
