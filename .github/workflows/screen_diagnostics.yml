name: Android screen diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p screen-captures
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.apexfit.app/.MainActivity
            sleep 20
            adb shell input tap 160 592
            sleep 10
            adb shell uiautomator dump /sdcard/home.xml
            adb pull /sdcard/home.xml screen-captures/home.xml
            adb exec-out screencap -p > screen-captures/home.png
            adb shell input tap 120 596
            sleep 5
            adb shell uiautomator dump /sdcard/train.xml
            adb pull /sdcard/train.xml screen-captures/train.xml
            adb exec-out screencap -p > screen-captures/train.png
            adb shell input tap 200 596
            sleep 5
            adb shell uiautomator dump /sdcard/nutrition.xml
            adb pull /sdcard/nutrition.xml screen-captures/nutrition.xml
            adb exec-out screencap -p > screen-captures/nutrition.png
            adb shell input tap 280 596
            sleep 5
            adb shell uiautomator dump /sdcard/progress.xml
            adb pull /sdcard/progress.xml screen-captures/progress.xml
            adb exec-out screencap -p > screen-captures/progress.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-captures
          path: screen-captures/
