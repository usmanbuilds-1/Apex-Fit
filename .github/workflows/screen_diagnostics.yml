name: Android screen diagnostics
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Enable hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture actual screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p screen-captures
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n com.apexfit.app/.MainActivity
            sleep 20
            size=$(adb shell wm size | tr -d '\r' | awk '{print $3}' | tail -1)
            width=$(echo "$size" | cut -dx -f1)
            height=$(echo "$size" | cut -dx -f2)
            adb shell input tap $((width / 2)) $((height * 89 / 100))
            sleep 8
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml screen-captures/initial.xml
            adb exec-out screencap -p > screen-captures/initial.png
            for tab in home train nutrition progress; do
              case "$tab" in home) part=1;; train) part=3;; nutrition) part=5;; progress) part=7;; esac
              adb shell input tap $((width * part / 8)) $((height * 94 / 100))
              sleep 5
              adb shell uiautomator dump /sdcard/window.xml
              adb pull /sdcard/window.xml "screen-captures/$tab.xml"
              adb exec-out screencap -p > "screen-captures/$tab.png"
            done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-captures
          path: screen-captures/
