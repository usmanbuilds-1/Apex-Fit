name: Apex Fit Android CI & APK Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Generate Room schemas before packaging migration fixtures
        run: ./gradlew :app:kspDebugKotlin --no-daemon

      - name: Build Debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon

      - name: Upload generated Room schemas
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexFit-Room-schemas
          path: app/schemas/
          if-no-files-found: error

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexFit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Render Compose screenshots
        if: always()
        run: ./gradlew :app:updateDebugScreenshotTest --no-daemon

      - name: Upload rendered screens
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ApexFit-Compose-renders
          path: app/build/outputs/screenshotTest-results/preview/debug/rendered
          if-no-files-found: warn
          retention-days: 14

